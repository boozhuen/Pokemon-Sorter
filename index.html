<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Team Sorter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card hero-card">
      <div class="pokeball" aria-hidden="true"></div>
      <p class="eyebrow">SPL Welfare Event</p>
      <h1>Pokémon Team Sorter</h1>
      <p class="subtitle">
        Enter your details and discover your team!
      </p>
    </section>

    <section class="card">
      <form id="participantForm">
        <label>
          Name
          <input id="name" type="text" required maxlength="80" placeholder="e.g. Lily Tan" />
        </label>

        <label>
          Group
          <select id="group" required>
            <option value="">Select group</option>
            <option value="Policy">Policy</option>
            <option value="Planning">Planning</option>
          </select>
        </label>

        <label>
          Department
          <input id="department" type="text" required maxlength="40" placeholder="e.g. RPL, TPA" />
        </label>

       <button type="submit" class="primary-btn">
          Register
        </button>
      </form>

      <div id="status" class="status" aria-live="polite"></div>

        <section
  id="waitingCard"
  class="waiting-card hidden"
>
  <div class="waiting-pokeball">
    <div class="pokeball" aria-hidden="true"></div>
  </div>

  <p class="eyebrow">
    Registration Complete
  </p>

  <h2>
    You're in!
  </h2>

  <p class="waiting-main">
    Please do not close this page.
  </p>

  <p class="waiting-sub">
    Please wait for further instructions from the emcee on your grouping.
  </p>

  <div class="waiting-dots" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>
</section>

      <section id="resultCard" class="result-card hidden">
        <p class="eyebrow">You have been assigned to</p>
        <h2 id="teamName"></h2>
        <p id="teamDetails"></p>
      </section>
    </section>

    

    <footer>
      <a href="admin.html">Admin</a>
    </footer>
  </main>

  <script type="module" src="participant.js"></script>
</body>
</html>
